name: AI DailyPulse

on:
  schedule:
    - cron: '0 0 * * *'     # UTC 00:00 = 北京时间 08:00 早报
    - cron: '0 12 * * *'    # UTC 12:00 = 北京时间 20:00 晚报
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # seen_urls.json lives in data/ (gitignored) — cache it so articles
      # aren't re-collected and re-published on every run.
      # Key includes run_id so the cache always re-saves with updated state;
      # restore-keys pulls the most recent previous cache.
      - name: Restore seen URLs cache
        uses: actions/cache@v4
        with:
          path: data/
          key: seen-urls-${{ github.run_id }}
          restore-keys: |
            seen-urls-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python src/main.py

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-output
          path: |
            output/
            data/raw_articles.json
