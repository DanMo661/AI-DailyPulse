name: AI DailyPulse

# v3 publish run: final collection batch + digest the whole pool + Feishu push
# + archive. Punctual 08:00 Beijing delivery is driven by an external cron
# service (cron-job.org) dispatching this workflow at 07:50; the GH schedule
# below is only a fallback because GH cron can start hours late. The guard
# step makes double pushes impossible: if today's edition is already on the
# `archive` branch, the fallback run exits without touching anything.
on:
  workflow_dispatch:
  schedule:
    # 三班错峰（北京 05:30/06:00/06:30 拉起），runner 内 sleep 到 UTC 23:50 =
    # 07:50 精确执行。实测 GH schedule 拥堵会整班丢失或迟到 1.5~3h（2026-11-19
    # ~ 22），单班被丢过 5/5——三班里只要一班落在 [启动, 23:50] 窗口内即准点；
    # 全迟到时最早到达的一班立即执行（~北京 08:00-09:00），guard 防双推。
    - cron: '30 21 * * *'
    - cron: '0 22 * * *'
    - cron: '30 22 * * *'
    # 兜底：北京 08:20。以上三班全没起来时立即补发。
    - cron: '20 0 * * *'

# 主/兜底两个触发可能因 runner 排队撞车——排队串行化，后者完整走 guard，
# 绝不并发双推
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 等待步最长 ~2h + 管线 ~6min
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # restored BEFORE the guard so the guard can read the feishu delivery
      # marker written into data/ by a previous successful publish run
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/
          key: seen-urls-${{ github.run_id }}
          restore-keys: |
            seen-urls-

      # 手动 dispatch 不等待（也是未来接外部 cron 服务的入口）；
      # schedule 触发则睡到北京 07:50。启动太晚（>23:50 UTC）或等待超 6h
      # （说明 target 已是明天）则立即执行，宁可稍晚不出空窗。
      - name: Wait until 07:50 Beijing
        if: github.event_name == 'schedule'
        run: |
          TARGET=$(date -u -d '23:50' +%s)
          NOW=$(date -u +%s)
          WAIT=$((TARGET - NOW))
          if [ $WAIT -le 0 ]; then
            echo "already past 07:50 Beijing — running now"
          elif [ $WAIT -gt 21600 ]; then
            echo "target $(date -u -d "@$TARGET" '+%F %T')Z would wait ${WAIT}s (>6h cap) — running now"
          else
            echo "sleeping ${WAIT}s until $(date -u -d "@$TARGET" '+%F %T')Z = 07:50 Beijing"
            sleep $WAIT
          fi

      - name: Skip if today's edition was already delivered
        id: guard
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y%m%d)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ -f data/feishu_sent.json ] && grep -q "$TODAY" data/feishu_sent.json; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "feishu already delivered today (marker) — skipping"
            exit 0
          fi
          git fetch origin archive --quiet 2>/dev/null || true
          if git cat-file -e "origin/archive:archive/$TODAY.md" 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "today's edition already published and archived — skipping"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run publish pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        # exit 1 on Feishu failure so the archive step below is skipped and
        # the 08:20 fallback retries with the pool intact
        run: python src/main.py publish

      # One commit per day goes to the `archive` branch (digest + cover);
      # main never receives bot commits. hashFiles guards the "normal empty
      # day" case (pool empty → nothing published → nothing to archive).
      - name: Archive daily edition
        if: success() && steps.guard.outputs.skip != 'true' && hashFiles('output/digest_*.md') != ''
        run: |
          TODAY=${{ steps.guard.outputs.today }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/archive >/dev/null 2>&1; then
            git fetch origin archive --quiet
            git checkout -B archive origin/archive
          else
            git checkout --orphan archive
            git rm -rf --quiet . 2>/dev/null || true
          fi
          mkdir -p archive covers
          cp "output/digest_$TODAY.md" "archive/$TODAY.md"
          cp output/cover_* covers/ 2>/dev/null || true
          git add archive covers
          if [ -n "$(git status --porcelain archive covers)" ]; then
            git commit -m "archive: $TODAY"
            git push origin archive
            echo "archived $TODAY"
          else
            echo "nothing new to archive"
          fi

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-output
          if-no-files-found: ignore
          path: |
            output/
            data/pool.json
            data/raw_articles.json
